[unix_http_server]
file=/data/logs/backend/rms-lite/tool/supervisord.sock  ; (the path to the socket file)
chmod=0700                      ; socket file mode (default 0700)
chown=www:www                   ; socket file uid:gid owner

[supervisord]
logfile=/data/logs/backend/rms-lite/tool/supervisord.log    ; (main log file;default $CWD/supervisord.log)
logfile_maxbytes=50MB               ; (max main logfile bytes b4 rotation;default 50MB)
logfile_backups=10                  ; (num of main logfile rotation backups;default 10)
loglevel=info                       ; (log level;default info; others: debug,warn,trace)
pidfile=/data/logs/backend/rms-lite/tool/supervisord.pid    ; (supervisord pidfile;default supervisord.pid)
nodaemon=false                      ; (start in foreground if true;default false)
minfds=1024                         ; (min. avail startup file descriptors;default 1024)
minprocs=200                        ; (min. avail process descriptors;default 200)

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///data/logs/backend/rms-lite/tool/supervisord.sock  ; use a unix:// URL  for a unix socket
history_file=~/.sc_history                  ; use readline history if available

[program:rms_http_server]
command=%(here)s/rms_http_server
directory=%(here)s/
numprocs=1
autostart=true
startsecs=5
startretries=3
autorestart=true
exitcodes=0,2
stopwaitsecs=10
user=www
redirect_stderr=true
stdout_logfile=/data/logs/backend/rms-lite/supervisor_program/%(program_name)s.log

[program:rms_ws_server]
command=%(here)s/rms_ws_server
directory=%(here)s/
numprocs=1
autostart=true
startsecs=5
startretries=3
autorestart=true
exitcodes=0,2
stopwaitsecs=10
user=www
redirect_stderr=true
stdout_logfile=/data/logs/backend/rms-lite/supervisor_program/%(program_name)s.log

[program:rms_trading_server]
command=%(here)s/rms_trading_server
directory=%(here)s/
numprocs=1
autostart=true
startsecs=5
startretries=3
autorestart=true
exitcodes=0,2
stopwaitsecs=10
user=www
redirect_stderr=true
stdout_logfile=/data/logs/backend/rms-lite/supervisor_program/%(program_name)s.log
