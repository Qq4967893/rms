  Cmd Cmd = 7;
  int32 Volume = 8;
  double OpenPrice = 9;
  double ClosePrice = 10;
  TradeClient OpenClient = 11;
  TradeClient CloseClient = 12;
  int64 OpenTime = 13;
  int64 CloseTime = 14;
  double Sl = 15;
  double Tp = 16;
  string Comment = 17;
  int64 Expiration = 18;
  double Commission = 19;
  double Swap = 20;
  double Profit = 21;
  double Margin = 22;
  double MarginRate = 23;
  bool DeleteFlag = 24;
  int32 Reason = 25;
  int32 Digits = 26;
  double Adminfee = 27;
  string DepositCurrency = 28;
  double UsdRate = 29;
  double GbpRate = 30;
  string Source  = 31;
  int32 Leverage = 32;
  double ProfitRate = 33;
}

