syntax = "proto3";
package proto.et6api;
option go_package = "./;et6api";

service ApiService {

  // account
  rpc OpenAccount (OpenAccountRequest) returns (NullResponse) {
  }
  rpc UpdateAccount (UpdateAccountRequest) returns (CommonResponse) {
  }
  rpc GetAccountInfoSummary(LoginRequest) returns(GetAccountInfoSummaryResponse){
  }
  rpc GetAccountRealtimeData (GetAccountRealtimeDataRequest) returns (GetAccountRealtimeDataResponse) {
  }
  rpc ClearAccount (ClearAccountRequest)returns(NullResponse){
  }
  rpc GetAccountInfo (LoginRequest) returns (GetAccountInfoResponse) {
  }
  rpc GetTradeHistorySummary (LoginsRequest) returns (GetTradeHistorySummaryResponse) {
  }
  rpc GetUserEquity (LoginsRequest) returns (GetUserEquityResponse) {
  }
  rpc ModifyGroups (ModifyGroupsRequest) returns (ModifyGroupsResponse) {
  }

  rpc ModifyUserReadOnly (ModifyUserReadOnlyRequest) returns (NullResponse) {
  }
  rpc TradePay(TradePayRequest) returns (TradePayResponse) {
  }
  rpc ClearBalance(ClearBalanceRequest) returns(NullResponse){
  }

  // adminfee_white_label
  rpc AddOrUpdateAdminfee (AddOrUpdateAdminfeeRequest) returns (CommonResponse) {
  }
  rpc GetAdminFee (GetAdminFeeRequest) returns (AdminfeeResponse) {
  }
  rpc GetWhiteLabelList (Null) returns (GetWhiteLabelListResponse) {
  }

  // cache
  rpc GetSymbol (GetSymbolRequest) returns (GetSymbolResponse) {
  }
  rpc GetSession (SessionRequest) returns (GetSessionResponse) {
  }

  rpc GetSourceInfo (GetSourceRequest) returns (GetSourceInfoResponse) {
  }
  rpc GetHoliday(Null) returns (GetHolidayResponse){
  }

  rpc GetSpreadInfo (Null) returns (GetSpreadInfoResponse) {
  }
  rpc GetGroupSecurity (Null) returns (GetGroupSecurityResponse) {
  }

  // cfd_equity
  rpc CfdOperate (CfdOperateRequest) returns (CfdOperateResponse) {
  }
  rpc GetStockSet (GetStockSetRequest) returns (GetStockSetResponse) {
  }
  rpc GetDividendInfoByTicket (GetDividendInfoByTicketRequest) returns (GetDividendInfoByTicketResponse) {
  }

  // copy
  rpc Copy(CopyRequest) returns (NullResponse){
  }
  rpc UnCopy(UnCopyRequest) returns (UnCopyResponse){
  }
  rpc CopyAvailableBalance(CopyAvailableBalanceRequest) returns (CopyAvailableBalanceResponse){
  }
  rpc ModifyCopyOrderControl(ModifyCopyOrderControlRequest) returns (NullResponse){
  }

  // group
  rpc GetGroupInfo (GetGroupInfoRequest) returns (GetGroupInfoResponse) {
  }
  rpc GetGroupSymbol (GetGroupSymbolRequest) returns (GetGroupSymbolResponse) {
  }
  // order
  rpc GetTrade (GetTradeRequest) returns (GetTradeResponse) {
  }
  rpc CheckHavePosition (LoginRequest) returns (CheckHavePositionResponse) {
  }
  rpc ModifyOrderComment (ModifyOrderCommentRequest) returns (CommonResponse) {
  }

  // trade
  rpc TradeOpen(TradeOpenRequest) returns (TradeResponse) {
  }
  rpc TradePending (TradePendingRequest) returns (TradeResponse) {
  }
  rpc ModifyTrade (ModifyTradeRequest) returns (TradeResponse) {
  }
  rpc TradeClose (TradeCloseRequest) returns (TradeResponse) {
  }
  rpc ModifyPending (ModifyPendingRequest) returns (TradeResponse) {
  }
  rpc TradeClosePending (TradeClosePendingRequest) returns (TradeResponse) {
  }
  rpc OperateTrade (OperateTradeRequest) returns (OperateTradeResponse) {
  }
  rpc TradeForcedClose (TradeForcedCloseRequest) returns (TradeForcedCloseResponse) {
  }
  rpc GetStopsLevel(Null) returns(GetStopsLevelInfoResponse){
  }
}

// Copy
// CopyRequest
message CopyRequest {
  int32 Login = 1;
  int32 MasterLogin = 2;
  double Amount = 3;
  CommonRequest CReq =4;
}
// NullResponse


// UnCopy
// UnCopyRequest
message UnCopyRequest {
  int32 MasterLogin = 1;
  oneof FIELD {
    bool IsBatch = 2;
    int32 Login = 3;
  };
  bool ForcedClose = 4;
  CommonRequest CReq =5;
}
// UnCopyResponse
message UnCopyResponse {
  message ResponseData {
    repeated Order Order = 1;
  }
  CommonResponse CResp = 1;
  ResponseData Data  = 2;
}

// CopyAvailableBalance
// CopyAvailableBalanceRequest
message CopyAvailableBalanceRequest {
  int32 Login = 1;
  int32 MasterLogin = 2;
  CommonRequest CReq =3;
}
// CopyAvailableBalanceResponse
message CopyAvailableBalanceResponse {
  double Data = 1;
  CommonResponse CResp = 2;
}

// ModifyCopyOrderControl
// ModifyCopyOrderControlRequest
message ModifyCopyOrderControlRequest {
  int64 SlaveTicket = 1;
  //0 跟随 1 自主
  int32 SlaveLogin = 2;
  Control Control = 3;
  CommonRequest CReq = 4;
}
enum Control {
  SlaveControl = 0;
  SelfControl = 1;
}
// NullResponse

// TradePay
// TradePayRequest
message TradePayRequest {
  int32 Login = 1;
  double Price = 2;
  string Comment = 3;
  TradeClient Client = 4;
  CommonRequest CReq =5;
}

    //ClearBalance
// ClearBalanceRequest
message ClearBalanceRequest {
  int32 Login = 1;
  TradeClient Client = 2;
  CommonRequest CReq =3;
}
// TradePayResponse
message TradePayResponse {
  CommonResponse CResp = 1;
  PaymentData Data = 2;
}

message PaymentData {
  int64 Ticket = 1;
  int32 Login = 2;
  Cmd Cmd = 3;
  double Profit = 4;
  int64 CloseTime = 5;
  string Comment = 6;
}

// GetTrade
// GetTradeRequest
message GetTradeRequest {
  int32 Login = 1;
  GetTradeType Type = 2;
  string Tickets = 3;//Tickets有值的时候 GetTradeType/Offset/Limit 无效
  int32 Offset = 4;
  int32 Limit = 5;
  CommonRequest CReq =6;
}
enum GetTradeType {
  GTPending         = 0; //get pending order
  GTOpen            = 1; //get open order
  GTClose           = 2; //get close order
  GTPendingAndOpen  = 3; //get pending and open order
  GTAll = 4;//get all order
  GTPayment = 5;// get all peyment record
}
// GetTradeResponse
message GetTradeResponse {
  message ResponseData {
    int32 TradeCount = 1;
    repeated Order Order = 2;
  }
  CommonResponse CResp = 1;
  ResponseData Data  = 2;

}

// ClearBalance
// LoginRequest
// NullResponse

// TradeForcedClose
// TradeForcedCloseRequest
message TradeForcedCloseRequest {
  int32 Login = 1;
  int64 ticket = 2;
  CommonRequest CReq =3;
}
// TradeForcedCloseResponse
message TradeForcedCloseResponse{
  CommonResponse CResp = 1;
  repeated Order Data = 2;
}

// CheckHavePosition
// LoginRequest
// CheckHavePositionResponse
message CheckHavePositionResponse {
  message ResponseData {
    int32 Login = 1;
    bool  HavePosition = 2;
  }
  CommonResponse CResp = 1;
  ResponseData Data = 2;
}

// GetDividendInfoByTicket
// GetDividendInfoByTicketRequest
message GetDividendInfoByTicketRequest {
  int64 Ticket = 1;
  int32 Login = 2;
  CommonRequest CReq =3;
}
// GetDividendInfoByTicketResponse
message GetDividendInfoByTicketResponse {
  CommonResponse CResp = 1;
  repeated Dividend Data = 2;
}

message Dividend {
  double Amount = 1;
  int64 CreateAt = 2;
  int32 Status = 3;
  int32 DividendType = 4;
  int32 SetId = 5;
  int32 Login = 6;
}

// GetStockSet
// GetStockSetRequest
message GetStockSetRequest {
  string Source = 1;
  CommonRequest CReq =2;
}
// GetStockSetResponse
message GetStockSetResponse {
  CommonResponse CResp = 1;
  repeated StockSet Data = 2;
}

message StockSet {
  string Source = 1;
  int32 Direction  = 2;
  int32 Rate = 3;
  int64 StopOutTime = 4;
  int64 TakeEffectTime = 5;
  int32 Status = 6;
}


// ClearAccount
// ClearAccountRequest
message ClearAccountRequest {
  int32  login = 1;
  CommonRequest CReq = 2;
}
// NullResponse
message NullResponse {
  CommonResponse CResp = 1;
}

// GetAccountInfo
// LoginRequest
message LoginRequest {
  int32 Login = 1;
  CommonRequest CReq =2;
}

// GetAccountInfoResponse
message GetAccountInfoResponse {
  message ResponseData {
    int32 Login = 1;
    string Name = 2;
    string Phone =3;
    string Group = 4;
    string Comment  = 5;
    double Balance  =6;
    string  Description = 7;
    string Currency  = 8;
    EnableStatus  Status = 9 ;
  }
  CommonResponse CResp = 1;
  ResponseData Data = 2;
}

// GetTradeHistorySummary
// LoginsRequest
message LoginsRequest {
  string Logins = 1;
  CommonRequest CReq =2;
}
// GetTradeHistorySummaryResponse
message GetTradeHistorySummaryResponse {
  message ResponseData {
    double SumLot = 1;
    double SumProfit = 2;
    double SumDeposit  = 3;
    int32 SumWinOrder = 4;
    int32 SumClosedOrder = 5;
    int32 SumPositionOrder = 6;
    int32 SumPendingOrder = 7;
  }
  CommonResponse CResp = 1;
  ResponseData Data = 2;
}

// GetUserEquity
// LoginsRequest
// GetUserEquityResponse
message GetUserEquityResponse {
  CommonResponse CResp = 1;
  repeated EquityInfo Data = 2;
}

message EquityInfo {
  int32 Login = 1;
  double Margin = 2;
  double MarginFree  = 3;
  double Equity  = 4;
  double Balance  = 5;
  double MarginLevel = 6;
}


// ModifyGroups
// ModifyGroupsRequest
message ModifyGroupsRequest {
  map<int32, ModifyGroupsData> UserGroup = 1;
  CommonRequest CReq =2;
}

message ModifyGroupsData{
  string NewGroupName = 1;
  string OldGroupName = 2;
}
// ModifyGroupsResponse
message ModifyGroupsResponse{
  CommonResponse CResp = 1;
  map<int32, int32> Data = 2;
}
// OpenAccount
// OpenAccountRequest
message OpenAccountRequest {
  int32 Login = 1;
  string Name = 2;
  string Password = 3;
  string Currency = 4;
  optional  EnableStatus  Status = 5;
  string Group = 6;
  string Phone = 7;
  string Email = 8;
  string Comment = 9;
  CommonRequest CReq =10;
}
// NullResponse


// ModifyUserReadOnly
// ModifyUserReadOnlyRequest
message ModifyUserReadOnlyRequest {
  int32 Login = 1;
  bool IsReadOnly = 2;
  CommonRequest CReq =3;
}
// NullResponse

message UpdateAccountRequest {
  RequestSourceEnum RequestSource = 1;
  int32  Login = 2;
  string Name = 3;
  string Phone = 4;
  string GroupName = 5;
  EnableStatus  Status = 6;
  string Description =7;
}

message ModifyOrderCommentRequest {
  RequestSourceEnum RequestSource = 1;
  int32 Login = 2;
  int64 Ticket = 3;
  string Comment = 4;
}


message GetAccountInfoSummaryResponse {
  int32 StatusCode = 1;
  string Msg = 2;
  AccountSummaryInfo Data = 3;
}

message AccountSummaryInfo {
  int64  AddTime = 1;
  string Group = 2;
  EnableStatus  Status = 3;
  string Description = 4;
  double Balance = 5;
  double Equity = 6;
  double UsedMargin = 7;
  double FreeMargin = 8;
  double Deposit = 9;
  double Withdraw = 10;
  double ClosedProfit = 11;
  double PositionProfit = 12;
  string Currency = 13;
}

message GetAccountRealtimeDataRequest {
  RequestSourceEnum RequestSource = 1;
  repeated int32 Login = 2;
}

message GetAccountRealtimeDataResponse {
  int32 StatusCode = 1;
  string Msg = 2;
  repeated AccountRealtimeDataResult Data = 3;
}

message AccountRealtimeDataResult {
  int32 StatusCode = 1;
  string Msg = 2;
  int32 Login = 3;
  double Margin = 4;
  double MarginFree = 5;
  double MarginLevel = 6;
  double Equity = 7;
  double Balance = 8;
}

message ChangeGroupResult {
  int32 StatusCode = 1;
  string Msg = 2;
  int32 Login = 3;
}

// Adminfee
message GetAdminFeeRequest {
  RequestSourceEnum RequestSource = 1;
  int32 WhiteLabelID = 2;
}

message AdminfeeResponse {
  int32 StatusCode = 1;
  string Msg = 2;
  map<int32, AdminfeeList> Data = 3;
}

message AdminfeeList {
  repeated Adminfee Data = 1;
}

message Adminfee {
  string Source=1;
  int32  WhiteLabelID=2;
  double FeeRate =3;
}

message AddOrUpdateAdminfeeRequest {
  RequestSourceEnum RequestSource = 1;
  string Source=2;
  int32  WhiteLabelID=3;
  double FeeRate =4;
}

message GetWhiteLabelListResponse {
  int32 StatusCode = 1;
  string Msg = 2;
  repeated WhiteLabel Data = 3;
}

message WhiteLabel{
  int32 WhiteLabelID=1;
  string WhiteLabelName=2;
}

//cache
message SessionsInfo {
  map<int32, string> SessionInfo = 1;
}

message SymbolList {
  repeated string Symbol = 1;
}


// CFD
message CfdOperateRequest {
  RequestSourceEnum RequestSource = 1;
  int32 Login = 2;
  int64 Ticket = 3;
  CfdOperateType Type = 4;
  double OpenClientPrice = 5;
  double OpenServerPrice = 6;
  double OpenOrderPrice = 7;
  int32 Volume = 8;
  double Tp = 9;
  double Sl = 10;
}

message CfdOperateResponse {
  int32 StatusCode = 1;
  string Msg = 2;
}

// GetGroupInfo
// GetGroupInfoRequest
message GetGroupInfoRequest {
  repeated string GroupNames = 1;
  CommonRequest CReq =2;
}
// GetGroupInfoResponse
message GetGroupInfoResponse {
  CommonResponse CResp = 1;
  repeated GetGroupInfoResponseGroupInfo Data = 2;
}


message GetGroupInfoResponseGroupInfo {
  string GroupName = 1;
  TradeType TradeType = 3;
  double MarginStopOut = 4;
  double MarginCallPrimary = 5;
  double MarginCallSecondary = 6;
  MarginMode MarginMode = 7;
  int32 IsChargeSwap = 8;
  map<string, ConGroupSec> SecGroups = 9;
  WhiteLabel WhiteLabel = 10;
}

// GetSymbol
// GetSymbolRequest
message GetSymbolRequest {
  string Symbol = 1;
  enum SymbolLevelType {
    All = 0;
    AllNoLevel  = 1;
  }
  SymbolLevelType Type = 2 ;
  CommonRequest CReq =3;
}
// GetSymbolResponse
message GetSymbolResponse {
  CommonResponse CResp = 1;
  repeated SymbolInfo Data  = 2;
}

message SymbolInfo {
  string Symbol = 1;
  double LotMin = 2;
  double LotMax = 3;
  double LotStep = 4;
  double CommBase = 5;
  double SwapLong = 6;
  double SwapShort = 7;
  double SwapLongCharge = 8;
  double SwapShortCharge = 9;
  string Currency = 11;
  int32 Digits = 12;
  double Multiply = 13;
  double MarginDivider = 14;
  double MarginInitial = 15;
  double MarginHedged = 16;
  int32 MarginMode = 17;
  int32 SwapRollover3days = 18;
  int32 SwapType = 20;
  int32 ProfitMode = 21;
  double ContractSize = 22;
  int32 StopLevel = 24;
  string SecurityName = 25;
  string ProfitCurrency= 26;
  SourceType SourceType= 27;
}

// GetSession
// SessionRequest
message SessionRequest {
  string Symbol = 1;

  enum SessionType {
    Quote = 0;
    Trade  = 1;
  }
  SessionType Type = 2;
  CommonRequest CReq =3;
}
// GetSessionResponse
message GetSessionResponse {
  CommonResponse CResp = 1;
  map<string,SessionInfo>  Data  = 2;
}
message SessionInfo {
  map<int32,string> Data=1;
}

message GetGroupSecurityResponse {
  CommonResponse CResp = 1;
  map<string,SecurityMap> Data = 2;
}

message SecurityMap{
  map<string, SecurityInfo> Data =1;
}
message SecurityInfo {
  int32 SpreadDiff = 4;
  double CommBase = 5;
}

message GetSpreadInfoResponse {
  message ResponseData {
    map<string, SymbolList> SecuritySymbol = 1;
    map<string, SecuritySpreadOffsetList> GroupSecuritySpreadOffset  = 2;
  }
  CommonResponse CResp = 1;
  ResponseData Data = 2;
}

message SecuritySpreadOffsetList{
  map<string, int32> Data  =1 ;
}


// GetGroupSymbol
// GetGroupSymbolRequest
message GetGroupSymbolRequest {
  string Group = 1;
  CommonRequest CReq =2;
}
// GetGroupSymbolResponse
message GetGroupSymbolResponse {
  CommonResponse CResp = 1;
  map<string,SymbolSecurityMap> Data = 2;
}

message SymbolSecurityMap {
  map<string, SymbolSecurityInfo> Data =1;
}
message SymbolSecurityInfo {
  int32 SpreadDiff = 1;
  double CommBase = 2;
  map<string, int32> Data =3;
}

//group


message GetGroupNameResponse {
  int32 StatusCode = 1;
  string Msg = 2;
  repeated GroupNameInfo Data = 3;
}

message GroupNameInfo {
