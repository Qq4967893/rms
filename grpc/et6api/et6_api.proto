message AddHolidayRequest {
  RequestSourceEnum RequestSource = 1;
  bool Enable = 2;
  string Date = 3;
  string From = 4;
  string To = 5;
  string Symbol = 6;
  string Description = 7;
}

message UpdateHolidayRequest {
  RequestSourceEnum RequestSource = 1;
