message CommonRequest {
  string PHPHost = 1;
  string RequestID = 2;
  int64  PHPTime = 3;
}


message TradeResponse {
  CommonResponse CResp = 1;
  Order Data = 2;
}

message Order {
  int64 Ticket = 1;
  int32 Login = 2;
  string Symbol = 3;
  Cmd Cmd = 4;
  int32 Volume = 5;
  double SL = 6;
  double TP = 7;
  TradeClient OpenClient = 8;
  double OpenPrice = 9;
  int64 OpenTime = 10;
  TradeClient CloseClient = 11;
  double ClosePrice = 12;
  int64 CloseTime = 13;
  int32 Digits = 14;
  int64 Expiration = 15;
  double Profit = 16;
  double Commission = 17;
  double Swap = 18;
  double AdminFee = 19;
  double Margin = 20;
  double MarginRate = 21;
  string Comment = 22;
  int32 StopsLevel = 23;
  double Multiply = 24;
  string ProfitCurrency = 25;
  double UsdRate = 26;
  double GbpRate = 27;
  Type Type = 28;
  int32 Reason = 29;
  string DepositCurrency = 30;
  string RequestId = 31;
  int64 ModifyTime = 32;
  string Source  = 33;
  int32 Leverage = 34;
  double ProfitRate = 35;
}

