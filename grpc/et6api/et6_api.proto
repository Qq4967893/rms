//Request
message OperateTradeRequest {
  RequestSourceEnum RequestSource = 1;
  Type Type = 2;
  int32 Login = 3;
  int64 Ticket = 4; //Order Ticket Num
  Cmd Cmd = 5;
  string Source = 6; //Source Name
  int32 Leverage = 7;
  int32 Volume = 8;
  double Tp = 9; //decimal.Decimal Take Profit Price to Set
  double Sl = 10; //decimal.Decimal Stop Loss Price to Set
  double ClientPrice = 11; //decimal.Decimal Client Price when Request
  int64 ClientTime = 12; //Standard UNIX Timestamp when Request
  double PendingPrice = 13;
  int64 Expiration = 14;
  double Amount = 15;
  string Comment = 16;
  TradeClient Client = 17;
}

//Response
message OperateTradeResponse {
  int32 StatusCode = 1;
  string Msg = 2;
  repeated TradeOrderReply Data = 3;
}

